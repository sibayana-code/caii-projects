<script>
(function(){
var SALT='mKe3hr4iil5+NX4xooVxhA==',ITERS=600000,KEYNAME='locked-site-key';
var msg=document.getElementById('msg'),form=document.getElementById('f'),pw=document.getElementById('p'),
    rem=document.getElementById('r'),btn=document.getElementById('b');
function say(t,bad){msg.textContent=t;msg.className=bad?'err':''}
function b2a(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function a2b(a){var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function load(){try{return localStorage.getItem(KEYNAME)}catch(e){return null}}
function save(v){try{localStorage.setItem(KEYNAME,v)}catch(e){}}
function forget(){try{localStorage.removeItem(KEYNAME)}catch(e){}}
var subtle=window.crypto&&window.crypto.subtle;
if(!subtle||!window.TextEncoder){say('This browser cannot open the page. Open the link in Safari or Chrome.',true);form.style.display='none';return}
function derive(pass){
  var p=pass.trim();if(p.normalize)p=p.normalize('NFC');
  return subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits'])
    .then(function(k){return subtle.deriveBits({name:'PBKDF2',salt:b2a(SALT),iterations:ITERS,hash:'SHA-256'},k,256)})
    .then(function(bits){return new Uint8Array(bits)});
}
function unlock(raw){
  var data=b2a(document.getElementById('payload').textContent.replace(/\s+/g,''));
  return subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])
    .then(function(k){return subtle.decrypt({name:'AES-GCM',iv:data.slice(0,12)},k,data.slice(12))})
    .then(function(buf){return new TextDecoder().decode(buf)});
}
// Replace the whole page. Only once this page has finished loading: written earlier, the
// opened page is added below the password box instead of replacing it.
function show(html){
  if(document.readyState!=='complete'){window.addEventListener('load',function(){show(html)});return}
  setTimeout(function(){document.open();document.write(html);document.close()},0);
}
form.addEventListener('submit',function(ev){
  ev.preventDefault();
  if(!pw.value){return}
  btn.disabled=true;say('Opening...');
  var raw;
  derive(pw.value).then(function(r){raw=r;return unlock(r)}).then(function(html){
    if(rem.checked){save(a2b(raw))}
    show(html);
  }).catch(function(){btn.disabled=false;pw.value='';say('Wrong password. Try again.',true);pw.focus()});
});
var kept=load();
if(kept){
  say('Opening...');
  unlock(b2a(kept)).then(show).catch(function(){forget();say('Enter the password to open.')});
}
})();
</script>
